<!doctype html>

  <head>

    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Trà Nguyễn Gia Khánh — AI × ERP Operating System" />

      property="og:description"
      content="Data → Intelligence → Workflow → Impact. Applied AI, ERP transformation and R&D for smarter operations."
    />
    <meta property="og:image" content="/og.png" />

    <title>Trà Nguyễn Gia Khánh — AI × ERP Operating System</title>
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/gk-16-v2.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/gk-32-v2.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/gk-192-v2.png?v=2" />
    <link rel="shortcut icon" type="image/png" href="./favicon-v2.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/gk-180-v2.png?v=2" />
    <meta name="application-name" content="Gia Khánh Portfolio" />

    <script>
      (() => {
        const saved = localStorage.getItem("portfolio-theme");
        const preferred =
          saved ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.dataset.theme = preferred;
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/portfolio.css" />
  </head>
  <body class="is-splashing">
    <div class="splash" id="splash" aria-hidden="true">
      <div class="splash-inner">
        <span class="splash-mark">GK</span>
        <p class="splash-name">TRÀ NGUYỄN GIA KHÁNH</p>
        <div class="splash-rule"><i></i></div>
        <p class="splash-focus">AI SYSTEMS · ERP OPERATIONS · R&amp;D</p>
      </div>
    </div>

    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header" id="siteHeader">
      <nav class="nav-shell" aria-label="Primary navigation">
        <a class="brand" href="#top" aria-label="Gia Khánh — trang chủ">
          <span class="brand-mark" aria-hidden="true">GK</span>
          <span class="brand-name">
            <strong>Gia Khánh</strong>
            <small>AI · ERP · R&amp;D</small>
          </span>
        </a>

        <div class="nav-links" id="navLinks">
          <a href="#systems" data-nav="systems">AI × ERP</a>
          <a href="#experience" data-nav="experience">Kinh nghiệm</a>
          <a href="#projects" data-nav="projects">Dự án</a>
          <a href="#certificates" data-nav="certificates">Chứng chỉ</a>
          <a href="#about" data-nav="about">Năng lực</a>
          <a href="#contact" data-nav="contact">Liên hệ</a>
        </div>

        <div class="nav-controls">
          <button
            class="icon-button"
            id="themeToggle"
            type="button"
            aria-label="Switch color theme"
          >
            <span class="theme-icon theme-icon-bulb theme-icon-off" aria-hidden="true"><i></i></span>
            <span class="theme-icon theme-icon-bulb theme-icon-on" aria-hidden="true"><i></i></span>
          </button>
          <button
            class="language-toggle"
            id="languageToggle"
            type="button"
            aria-label="Switch language"
          >
            <span data-lang-option="vi">VI</span>
            <i></i>
            <span data-lang-option="en">EN</span>
          </button>
          <button
            class="menu-toggle"
            id="menuToggle"
            type="button"
            aria-label="Open menu"
            aria-controls="navLinks"
            aria-expanded="false"
          >
            <span></span><span></span>
          </button>
        </div>
      </nav>
    </header>

    <main id="main">
      <section class="hero" id="top">
        <div class="page-shell hero-layout">
          <div class="hero-copy">
            <div class="eyebrow-row">
              <span class="eyebrow" id="heroEyebrow"></span>
              <span class="availability"><i></i><span id="heroStatus"></span></span>
            </div>
            <p class="hero-name" id="heroName"></p>
            <h1 id="heroTitle"></h1>
            <p class="hero-intro" id="heroIntro"></p>
            <div class="hero-actions">
              <a class="button button-primary" href="#systems" id="heroPrimary"></a>
              <a class="button button-quiet" href="#projects" id="heroSecondary"></a>
            </div>
            <div class="hero-footer">
              <span id="heroFootnote"></span>
              <span>Scroll ↓</span>
            </div>
          </div>

          <aside class="hero-profile-panel" aria-labelledby="profilePanelTitle">
            <div class="profile-panel-top">
              <span id="profilePanelLabel"></span>
              <span>2026 / HCMC</span>
            </div>

            <div class="profile-heading">
              <span class="profile-index" aria-hidden="true">01</span>
              <div>
                <p id="profileDirection"></p>
                <h2 id="profilePanelTitle"></h2>
              </div>
            </div>

            <div class="profile-areas">
              <article class="profile-area">
                <span>01</span>
                <div>
                  <strong id="profileArea1Title"></strong>
                  <small id="profileArea1Meta"></small>
                </div>
              </article>
              <article class="profile-area">
                <span>02</span>
                <div>
                  <strong id="profileArea2Title"></strong>
                  <small id="profileArea2Meta"></small>
                </div>
              </article>
              <article class="profile-area">
                <span>03</span>
                <div>
                  <strong id="profileArea3Title"></strong>
                  <small id="profileArea3Meta"></small>
                </div>
              </article>
              <article class="profile-area">
                <span>04</span>
                <div>
                  <strong id="profileArea4Title"></strong>
                  <small id="profileArea4Meta"></small>
                </div>
              </article>
            </div>

            <div class="profile-route">
              <small id="profileRouteLabel"></small>
              <div>
                <span data-profile-route="0"></span>
                <i></i>
                <span data-profile-route="1"></span>
                <i></i>
                <span data-profile-route="2"></span>
                <i></i>
                <span data-profile-route="3"></span>
              </div>
            </div>
            <div class="profile-metrics" aria-label="Portfolio metrics">
              <span><strong>03</strong><small id="profileMetricExperience"></small></span>
              <span><strong>08</strong><small id="profileMetricProjects"></small></span>
              <span><strong>40%</strong><small id="profileMetricImpact"></small></span>
            </div>
          </aside>
        </div>
      </section>

      <section class="section system-section" id="systems">
        <div class="page-shell">
          <div class="system-heading">
            <div>
              <p class="eyebrow" id="systemEyebrow"></p>
              <span class="system-status"><i></i><span id="systemStatus"></span></span>
            </div>
            <div>
              <h2 id="systemTitle"></h2>
              <p id="systemIntro"></p>
            </div>
          </div>

          <div class="system-workflow" id="systemWorkflow"></div>

          <div class="system-proof">
            <div class="system-metrics" id="systemMetrics"></div>
            <p id="systemProofNote"></p>
          </div>
        </div>
      </section>

      <section class="section section-ruled" id="journey">
        <div class="page-shell">
          <div class="section-heading">
            <p class="eyebrow" id="journeyEyebrow"></p>
            <div>
              <h2 id="journeyTitle"></h2>
              <p id="journeyIntro"></p>
            </div>
          </div>
          <div class="journey-grid" id="journeyGrid"></div>
        </div>
      </section>

      <section class="section work-section" id="work">
        <div class="page-shell">
          <div class="section-heading">
            <p class="eyebrow" id="workEyebrow"></p>
            <div>
              <h2 id="workTitle"></h2>
              <p id="workIntro"></p>
            </div>
          </div>
          <article class="education-card" id="educationCard"></article>
          <div class="work-grid" id="workGrid"></div>
        </div>
      </section>

      <section class="section experience-section" id="experience">
        <div class="page-shell">
          <div class="section-heading">
            <p class="eyebrow" id="experienceEyebrow"></p>
            <div>
              <h2 id="experienceTitle"></h2>
              <p id="experienceIntro"></p>
            </div>
          </div>
          <div class="experience-list" id="experienceList"></div>
          <article class="recommendation-card" id="recommendationCard"></article>
        </div>
      </section>

      <section class="section section-ruled" id="projects">
        <div class="page-shell">
          <div class="section-heading">
            <p class="eyebrow" id="projectsEyebrow"></p>
            <div>
              <h2 id="projectsTitle"></h2>
              <p id="projectsIntro"></p>
            </div>
          </div>

          <div class="project-toolbar">
            <div class="project-filters" id="projectFilters" role="group"></div>
            <p id="projectCount"></p>
          </div>
          <div class="carousel-frame">
            <button
              class="carousel-control carousel-previous"
              id="projectPrevious"
              type="button"
              aria-label="Dự án trước"
            >←</button>
            <div
              class="project-grid carousel-track"
              id="projectGrid"
              tabindex="0"
              role="region"
              aria-label="Danh sách dự án"
            ></div>
            <button
              class="carousel-control carousel-next"
              id="projectNext"
              type="button"
              aria-label="Dự án tiếp theo"
            >→</button>
          </div>
          <div class="carousel-meta">
            <div class="carousel-progress"><i id="projectProgress"></i></div>
            <span id="projectSlideStatus" aria-live="polite"></span>
          </div>
        </div>
      </section>

      <section class="section certificates-section" id="certificates">
        <div class="page-shell">
          <div class="section-heading">
            <p class="eyebrow" id="certificatesEyebrow"></p>
            <div>
              <h2 id="certificatesTitle"></h2>
              <p id="certificatesIntro"></p>
            </div>
          </div>
          <div class="carousel-frame">
            <button
              class="carousel-control carousel-previous"
              id="certificatePrevious"
              type="button"
              aria-label="Chứng chỉ trước"
            >←</button>
            <div
              class="certificate-grid carousel-track"
              id="certificateGrid"
              tabindex="0"
              role="region"
              aria-label="Danh sách chứng chỉ"
            ></div>
            <button
              class="carousel-control carousel-next"
              id="certificateNext"
              type="button"
              aria-label="Chứng chỉ tiếp theo"
            >→</button>
          </div>
          <div class="carousel-meta">
            <div class="carousel-progress"><i id="certificateProgress"></i></div>
            <span id="certificateSlideStatus" aria-live="polite"></span>
          </div>
          <div class="certificate-more" id="certificateMore"></div>
        </div>
      </section>

      <section class="section" id="about">
        <div class="page-shell about-layout">
          <div class="about-copy">
            <p class="eyebrow" id="aboutEyebrow"></p>
            <h2 id="aboutTitle"></h2>
            <p id="aboutIntro"></p>
            <a
              class="button button-quiet"
              id="cvLink"
              target="_blank"
              rel="noopener"
            ></a>
          </div>
          <div class="skill-groups" id="skillGroups"></div>
        </div>
      </section>

      <section class="section contact-section" id="contact">
        <div class="page-shell">
          <div class="contact-card">
            <p class="eyebrow" id="contactEyebrow"></p>
            <h2 id="contactTitle"></h2>
            <p id="contactIntro"></p>
            <div class="contact-actions">
              <div class="contact-direct">
                <a
                  class="button button-primary"
                  href="mailto:khanhtra229@gmail.com"
                  id="emailLink"
                ></a>
                <a
                  class="button contact-phone-button"
                  href="tel:+84792661744"
                  id="phoneLink"
                ></a>
              </div>
              <div class="social-links">
                <span id="socialLabel"></span>
                <a
                  href="https://github.com/trakhanh"
                  target="_blank"
                  rel="noopener"
                  >GitHub ↗</a
                >
                <a
                  href="https://www.linkedin.com/in/tranguyengiakhanh/"
                  target="_blank"
                  rel="noopener"
                  >LinkedIn ↗</a
                >
                <a
                  href="https://www.facebook.com/kthietkek/"
                  target="_blank"
                  rel="noopener"
                  >Facebook ↗</a
                >
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="page-shell">
        <p id="footerText"></p>
        <p>© <span id="currentYear"></span></p>
      </div>
    </footer>

    <button class="back-to-top" id="backToTop" type="button" aria-label="Về đầu trang">
      <span aria-hidden="true">↑</span>
    </button>

    <div class="recommendation-modal" id="recommendationModal" hidden></div>

    <script src="./js/portfolio-data.js"></script>
    <script src="./js/portfolio.js"></script>
