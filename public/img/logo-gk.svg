<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gia Khánh Logo">
  <defs>
    <linearGradient id="gkGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0077ff" />
    </linearGradient>
    <linearGradient id="gkPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12162a" />
      <stop offset="100%" stop-color="#080a14" />
    </linearGradient>
    <filter id="gkNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Cyber Hexagon Plate -->
  <polygon
    points="50,4 90,27 90,73 50,96 10,73 10,27"
    fill="url(#gkPlate)"
    stroke="url(#gkGlow)"
    stroke-width="2.5"
    filter="url(#gkNeon)"
  />

  <!-- Subtle Outer Circuit Bezel -->
  <polygon
    points="50,9 85,29 85,71 50,91 15,71 15,29"
    fill="none"
    stroke="rgba(0, 240, 255, 0.25)"
    stroke-width="1"
    stroke-dasharray="6 3"
  />

  <!-- Hexagon Corner Sensor Accents -->
  <circle cx="50" cy="4" r="2.5" fill="#00ff88" />
  <circle cx="90" cy="27" r="2" fill="#00d4ff" />
  <circle cx="90" cy="73" r="2" fill="#00ff88" />
  <circle cx="50" cy="96" r="2.5" fill="#00d4ff" />
  <circle cx="10" cy="73" r="2" fill="#00ff88" />
  <circle cx="10" cy="27" r="2" fill="#00d4ff" />

  <!-- Monogram 'G' (Left Geometric Cyber Glyph) -->
  <path
    d="M45,28 L30,28 L23,35 L23,65 L30,72 L46,72 L50,68 L50,52 L36,52"
    fill="none"
    stroke="url(#gkGlow)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#gkNeon)"
  />

  <!-- Monogram 'K' (Right Dynamic Cyber Glyph) -->
  <!-- Vertical Spine -->
  <path
    d="M57,28 L57,72"
    fill="none"
    stroke="url(#gkGlow)"
    stroke-width="4.5"
    stroke-linecap="round"
    filter="url(#gkNeon)"
  />
  <!-- Top Diagonal Branch with Terminal Node -->
  <path
    d="M58,50 L72,32 L78,32"
    fill="none"
    stroke="url(#gkGlow)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#gkNeon)"
  />
  <!-- Bottom Diagonal Branch with Terminal Node -->
  <path
    d="M58,50 L73,68 L78,68"
    fill="none"
    stroke="url(#gkGlow)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#gkNeon)"
  />

  <!-- Center Laser Convergence Node -->
  <circle cx="57.5" cy="50" r="3.5" fill="#00ff88" filter="url(#gkNeon)" />
  <circle cx="57.5" cy="50" r="1.5" fill="#ffffff" />
</svg>
