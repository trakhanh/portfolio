<!doctype html>
<html lang="vi" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ecece6" />
    <meta
      name="description"
      content="Case study dự án của Trà Nguyễn Gia Khánh — bài toán, vai trò, quy trình thực hiện, công nghệ và kết quả."
    />
    <meta property="og:type" content="article" />
    <meta property="og:title" content="Project Case Study — Trà Nguyễn Gia Khánh" />
    <meta
      property="og:description"
      content="Problem → Approach → Technology → Outcome."
    />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Project Case Study — Trà Nguyễn Gia Khánh</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/gk-32-v2.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/gk-180-v2.png?v=2" />

    <script>
      (() => {
        const saved = localStorage.getItem("portfolio-theme");
        const preferred =
          saved ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.dataset.theme = preferred;
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/portfolio.css" />
    <link rel="stylesheet" href="/css/project-detail.css?v=3" />
  </head>
  <body class="case-page">
    <a class="skip-link" href="#caseMain">Skip to content</a>

    <header class="case-header">
      <nav class="page-shell case-nav" aria-label="Project navigation">
        <a class="brand" href="/#projects" id="caseBrand" aria-label="Back to portfolio">
          <span class="brand-mark" aria-hidden="true">GK</span>
          <span class="brand-name">
            <strong>Gia Khánh</strong>
            <small>AI · ERP · R&amp;D</small>
          </span>
        </a>
        <a class="case-back-link" href="/#projects" id="backToPortfolio">← Portfolio</a>
        <div class="nav-controls">
          <button
            class="icon-button"
            id="themeToggle"
            type="button"
            aria-label="Switch color theme"
          >
            <span class="theme-icon theme-icon-bulb theme-icon-off" aria-hidden="true"><i></i></span>
            <span class="theme-icon theme-icon-bulb theme-icon-on" aria-hidden="true"><i></i></span>
          </button>
          <button
            class="language-toggle"
            id="languageToggle"
            type="button"
            aria-label="Switch language"
          >
            <span data-lang-option="vi">VI</span>
            <i></i>
            <span data-lang-option="en">EN</span>
          </button>
        </div>
      </nav>
    </header>

    <main id="caseMain">
      <article class="case-study">
        <header class="case-hero">
          <div class="page-shell">
            <div class="case-kicker">
              <span id="caseIndex"></span>
              <span id="casePhase"></span>
            </div>
            <div class="case-hero-grid">
              <div class="case-title-block">
                <h1 id="caseTitle"></h1>
                <p id="caseSummary"></p>
              </div>
              <dl class="case-meta">
                <div>
                  <dt id="caseRoleLabel"></dt>
                  <dd id="caseRoleValue"></dd>
                </div>
                <div>
                  <dt id="caseResultLabel"></dt>
                  <dd id="caseResultValue"></dd>
                </div>
                <div>
                  <dt id="caseScopeLabel"></dt>
                  <dd id="caseScopeValue"></dd>
                </div>
              </dl>
            </div>
            <figure class="case-cover">
              <img id="caseImage" src="/og.png" alt="" decoding="async" fetchpriority="high" />
              <figcaption id="caseImageCaption"></figcaption>
            </figure>
          </div>
        </header>

        <nav class="case-section-nav" aria-label="Case study sections">
          <div class="page-shell">
            <a href="#challenge" id="caseNavChallenge"></a>
            <a href="#role" id="caseNavRole"></a>
            <a href="#process" id="caseNavProcess"></a>
            <a href="#technology" id="caseNavTechnology"></a>
            <a href="#outcome" id="caseNavOutcome"></a>
          </div>
        </nav>

        <div class="page-shell case-layout">
          <aside class="case-rail" aria-label="Project summary">
            <p id="caseMapLabel"></p>
            <div class="case-tags" id="caseTags"></div>
            <div class="case-flow">
              <a href="#challenge">
                <span>01</span>
                <strong id="caseFlowChallenge"></strong>
              </a>
              <a href="#process">
                <span>03</span>
                <strong id="caseFlowProcess"></strong>
              </a>
              <a href="#outcome">
                <span>05</span>
                <strong id="caseFlowOutcome"></strong>
              </a>
            </div>
          </aside>

          <div class="case-content">
            <section class="case-section" id="challenge">
              <p class="case-section-index">01</p>
              <h2 id="challengeTitle"></h2>
              <p class="case-lead" id="challengeText"></p>
            </section>

            <section class="case-section" id="role">
              <p class="case-section-index">02</p>
              <h2 id="roleTitle"></h2>
              <p class="case-lead" id="roleText"></p>
              <ul class="case-responsibilities" id="responsibilityList"></ul>
            </section>

            <section class="case-section" id="process">
              <p class="case-section-index">03</p>
              <h2 id="processTitle"></h2>
              <ol class="case-process" id="processList"></ol>
            </section>

            <section class="case-section" id="technology">
              <p class="case-section-index">04</p>
              <h2 id="technologyTitle"></h2>
              <div class="case-tech-grid" id="technologyGrid"></div>
            </section>

            <section class="case-section" id="outcome">
              <p class="case-section-index">05</p>
              <h2 id="outcomeTitle"></h2>
              <p class="case-lead" id="outcomeText"></p>
              <ul class="case-evidence" id="evidenceList"></ul>
              <div class="case-learning">
                <p id="learningLabel"></p>
                <strong id="learningText"></strong>
              </div>
              <p class="case-privacy" id="privacyNote" hidden></p>
              <div class="case-source-links" id="caseLinks"></div>
            </section>
          </div>
        </div>

        <footer class="case-footer">
          <div class="page-shell">
            <div class="case-pagination">
              <a href="#" id="previousProject"></a>
              <a href="#" id="nextProject"></a>
            </div>
            <div class="case-contact">
              <p id="caseContactEyebrow"></p>
              <h2 id="caseContactTitle"></h2>
              <a class="button button-primary" href="mailto:khanhtra229@gmail.com" id="caseContactButton"></a>
            </div>
          </div>
        </footer>
      </article>
    </main>

    <script src="/js/portfolio-data.js"></script>
    <script src="/js/project-details-data.js"></script>
    <script src="/js/project-detail.js?v=3"></script>
  </body>
</html>
